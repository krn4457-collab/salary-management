services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - salary-data:/app
    environment:
      DATABASE_URL: sqlite:///./salary.db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  salary-data:
